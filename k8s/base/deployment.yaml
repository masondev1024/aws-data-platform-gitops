apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-pipeline-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: data-pipeline-app
  template:
    metadata:
      labels:
        app: data-pipeline-app
    spec:
      containers:
        - name: app-pipeline-app
          image: data-pipeline-app
	  imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
