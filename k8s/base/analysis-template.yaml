apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: data-pipeline-canary
  labels:
    monitoring: data-pipeline
spec:
  args:
    - name: service-name
  metrics:
    - name: canary-error-rate
      initialDelay: 30s
      interval: 30s
      count: 3
      failureLimit: 1
      inconclusiveLimit: 1
      successCondition: result[0] < 0.01
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          query: >-
            sum(rate(raffle_http_requests_total{service="{{args.service-name}}",status=~"5.."}[2m]))
            /
            sum(rate(raffle_http_requests_total{service="{{args.service-name}}"}[2m]))
    - name: canary-apply-p95
      initialDelay: 30s
      interval: 30s
      count: 3
      failureLimit: 1
      inconclusiveLimit: 1
      successCondition: result[0] < 0.5
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          query: >-
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(raffle_http_request_duration_seconds_bucket{service="{{args.service-name}}",route="/api/apply"}[2m])
              )
            )
