apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: data-pipeline-canary
  labels:
    monitoring: data-pipeline
spec:
  args:
    - name: service-name
  metrics:
    - name: canary-error-rate
      initialDelay: 30s
      interval: 30s
      count: 3
      failureLimit: 1
      inconclusiveLimit: 1
      successCondition: result[0] < 0.01
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          query: >-
            (sum(rate(raffle_http_requests_total{service="{{args.service-name}}",status=~"5.."}[5m])) or vector(0))
            /
            clamp_min(sum(rate(raffle_http_requests_total{service="{{args.service-name}}"}[5m])), 1)
    - name: canary-apply-samples
      # A latency percentile is undefined when no apply request has reached
      # the canary. Fail closed on missing samples instead of allowing
      # result[0] to raise a runtime slice-index error.
      initialDelay: 30s
      interval: 30s
      count: 3
      failureLimit: 1
      inconclusiveLimit: 1
      successCondition: result[0] > 0
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          query: >-
            sum(increase(raffle_http_requests_total{service="{{args.service-name}}",route="/api/apply"}[5m]))
            or vector(0)
    - name: canary-apply-outbox-parity
      # Read the invariant from the writer database. App-side success and
      # persisted-event counters are intentionally not used as the source of
      # truth because both counters can be incremented by the same code path.
      # -1 means the measurement failed and therefore fails closed.
      initialDelay: 30s
      interval: 30s
      count: 3
      failureLimit: 0
      inconclusiveLimit: 1
      successCondition: result[0] == 0
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          query: >-
            min(raffle_apply_outbox_parity_gap{service="{{args.service-name}}"})
            or vector(-1)
    - name: canary-apply-p95
      initialDelay: 30s
      interval: 30s
      count: 3
      failureLimit: 1
      inconclusiveLimit: 1
      successCondition: result[0] < 0.5
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          query: >-
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(raffle_http_request_duration_seconds_bucket{service="{{args.service-name}}",route="/api/apply"}[5m])
              )
            )
            or vector(0)
