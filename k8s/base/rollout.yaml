apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: data-pipeline-rollout
spec:
  replicas: 2
  strategy:
    canary:
      canaryService: data-pipeline-svc-canary
      stableService: data-pipeline-svc-stable
      trafficRouting:
        alb:
          ingress: data-pipeline-ingress
          servicePort: 80
      steps:
        - setWeight: 10
        - pause: { duration: 2m }
        - setWeight: 50
        - pause: { duration: 5m }
  selector:
    matchLabels:
      app: data-pipeline-app
  template:
    metadata:
      labels:
        app: data-pipeline-app
    spec:
      containers:
        - name: app-container
          image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/data-pipeline-app:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
