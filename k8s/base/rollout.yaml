apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: data-pipeline-rollout
spec:
  replicas: 2
  strategy:
    canary:
      canaryService: data-pipeline-svc-canary
      stableService: data-pipeline-svc-stable
      trafficRouting:
        alb:
          ingress: data-pipeline-ingress
          servicePort: 80
      steps:
        - setWeight: 10
        - pause: { duration: 2m }
        - setWeight: 50
        - pause: { duration: 5m }
  selector:
    matchLabels:
      app: data-pipeline-app
  template:
    metadata:
      labels:
        app: data-pipeline-app
    spec:
      containers:
        - name: app-container
          image: data-pipeline-app:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: FLASK_ENV
              value: production
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
          envFrom:
            - configMapRef:
                name: raffle-config
            - secretRef:
                name: raffle-secret
