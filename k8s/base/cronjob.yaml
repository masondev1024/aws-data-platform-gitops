apiVersion: batch/v1
kind: CronJob
metadata:
  name: raffle-draw-job
spec:
  schedule: "* * * * *" # 매 1분마다 실행
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: draw-worker
            image: data-pipeline-app:latest
            command: ["python", "draw_winner.py"]
            envFrom:
            - configMapRef:
                name: raffle-config
            - secretRef:
                name: raffle-secret
          restartPolicy: OnFailure
