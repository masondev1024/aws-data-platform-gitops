apiVersion: v1
kind: ConfigMap
metadata:
  name: data-pipeline-sre-dashboard
  labels:
    grafana_dashboard: "1"
data:
  raffle-sre-overview.json: |
    {
      "uid": "data-pipeline-sre",
      "title": "Raffle SRE Overview",
      "tags": ["sre", "raffle", "data-pipeline"],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "HTTP request rate",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "sum by (route, status) (max by (pod, route, status) (rate(raffle_http_requests_total[5m])))",
              "legendFormat": "{{route}} {{status}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Apply p95 latency",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "fieldConfig": {"defaults": {"unit": "s", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 0.5}]}}},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (max by (pod, le, route) (rate(raffle_http_request_duration_seconds_bucket{route=\"/api/apply\"}[5m]))))",
              "legendFormat": "p95",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Apply 5xx ratio",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "fieldConfig": {"defaults": {"unit": "percentunit"}},
          "targets": [
            {
              "expr": "sum by (route) (max by (pod, route, status) (rate(raffle_http_requests_total{route=\"/api/apply\",status=~\"5..\"}[5m]))) / clamp_min(sum by (route) (max by (pod, route, status) (rate(raffle_http_requests_total{route=\"/api/apply\"}[5m]))), 1)",
              "legendFormat": "5xx ratio",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Database readiness",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 6, "x": 12, "y": 8},
          "fieldConfig": {"defaults": {"mappings": [{"type": "value", "options": {"0": {"text": "NOT READY", "color": "red"}, "1": {"text": "READY", "color": "green"}}}]}},
          "targets": [{"expr": "min(raffle_db_readiness)", "refId": "A"}]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Apply outcomes",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 6, "x": 18, "y": 8},
          "targets": [{"expr": "sum by (result) (max by (pod, result) (rate(raffle_apply_requests_total[5m])))", "legendFormat": "{{result}}", "refId": "A"}]
        },
        {
          "id": 6,
          "type": "stat",
          "title": "D2C apply / outbox parity gap",
          "description": "A non-zero value means a recent raffle entry has no matching transactional outbox row; -1 means the database check is unavailable. Treat either state as a release-stop.",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "fieldConfig": {"defaults": {"decimals": 0, "mappings": [{"type": "value", "options": {"-1": {"text": "UNAVAILABLE", "color": "red"}}}], "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}},
          "targets": [
            {
              "expr": "(min(raffle_apply_outbox_parity_gap) < 0) or max(raffle_apply_outbox_parity_gap) or vector(-1)",
              "legendFormat": "parity gap",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Transactional outbox outcomes",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "targets": [{"expr": "sum by (result) (max by (pod, result) (rate(raffle_outbox_events_total[5m])))", "legendFormat": "{{result}}", "refId": "A"}]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "목록 조회 p95 · p99",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 24},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "targets": [
            {"expr": "histogram_quantile(0.95, sum by (le) (max by (pod, le) (rate(raffle_http_request_duration_seconds_bucket{route=\"/\"}[1m]))))", "legendFormat": "p95", "refId": "A"},
            {"expr": "histogram_quantile(0.99, sum by (le) (max by (pod, le) (rate(raffle_http_request_duration_seconds_bucket{route=\"/\"}[1m]))))", "legendFormat": "p99", "refId": "B"}
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "DB 연결 · TLS 설정 p95",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 24},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "targets": [{"expr": "histogram_quantile(0.95, sum by (role, le) (max by (pod, role, le) (rate(raffle_db_connect_duration_seconds_bucket[1m]))))", "legendFormat": "{{role}}", "refId": "A"}]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "초당 DB 연결 생성",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 32},
          "targets": [{"expr": "sum by (role) (max by (pod, role) (rate(raffle_db_connect_duration_seconds_count[1m])))", "legendFormat": "{{role}}", "refId": "A"}]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "목록 캐시 사용 · 갱신 · 실패",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 32},
          "targets": [{"expr": "sum by (result) (max by (pod, result) (rate(raffle_catalog_cache_events_total[1m])))", "legendFormat": "{{result}}", "refId": "A"}]
        }
      ]
    }
