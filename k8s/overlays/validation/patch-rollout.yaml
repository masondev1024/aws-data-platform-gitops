# JSON patches preserve CRD container fields without an OpenAPI merge schema.
- op: test
  path: /spec/template/spec/containers/0/name
  value: app-container
- op: test
  path: /spec/template/spec/containers/0/env/1/name
  value: DEPLOYMENT_TIER
- op: replace
  path: /spec/template/spec/containers/0/env/1/value
  value: validation
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: ALLOW_FAILURE_DRILL
    value: "false"
- op: add
  path: /spec/template/spec/containers/0/volumeMounts
  value:
    - name: rds-ca-bundle
      mountPath: /etc/rds-ca
      readOnly: true
- op: add
  path: /spec/template/spec/containers/0/resources/limits
  value:
    cpu: "1"
    memory: "768Mi"
- op: add
  path: /spec/template/spec/containers/0/readinessProbe/httpGet/httpHeaders
  value:
    - name: Host
      value: live-lab.invalid
- op: add
  path: /spec/template/spec/containers/0/livenessProbe/httpGet/httpHeaders
  value:
    - name: Host
      value: live-lab.invalid
- op: add
  path: /spec/template/spec/volumes
  value:
    - name: rds-ca-bundle
      configMap:
        name: rds-ca-bundle
- op: add
  path: /spec/template/spec/terminationGracePeriodSeconds
  value: 60
- op: add
  path: /spec/template/spec/containers/0/lifecycle
  value:
    preStop:
      exec:
        # Keep the distroless app alive while EndpointSlice and ALB target
        # deregistration propagate; the ALB drain window is 30 seconds.
        command: ["/usr/bin/python3", "-c", "import time; time.sleep(30)"]
