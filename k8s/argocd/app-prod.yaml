apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-pipeline-app-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/masondev1024/my-data-platform
    targetRevision: cicd_test
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
