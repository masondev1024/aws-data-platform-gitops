name: CI

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "app/**"
      - "agentic_ops/**"
      - "k8s/**"
      - "loadtest/**"
      - "scripts/**"
      - "terraform/**"
      - "platform/**"
      - "Jenkinsfile"
      - "docs/**"
      - ".github/workflows/**"
  push:
    branches: [dev, main]
    paths:
      - "app/**"
      - "agentic_ops/**"
      - "k8s/**"
      - "loadtest/**"
      - "scripts/**"
      - "terraform/**"
      - "platform/**"
      - "Jenkinsfile"
      - "docs/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  platform-verify:
    name: Shared platform verification
    uses: ./.github/workflows/platform-verify.yaml
    permissions:
      contents: read

  docker-build:
    name: Docker build
    needs: platform-verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --pull --tag data-pipeline-app:ci ./app

  loadtest-script:
    name: k6 load-test script validation
    needs: platform-verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Inspect k6 scenarios and thresholds
        run: >-
          docker run --rm -i
          grafana/k6@sha256:5221b620a4f874faff6e32ba597aa667c058391fe4898b1c6f6377f062c6cdec
          inspect - < loadtest/raffle.js
