name: CD

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "k8s/**"
      - "scripts/write_release_evidence.py"
      - "scripts/prepare_release_candidate.py"
      - "scripts/verify_release_bundle.py"
      - "scripts/verify_platform.sh"
      - ".github/workflows/cd.yaml"
      - ".github/workflows/platform-verify.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-image-publish
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: data-pipeline-app

jobs:
  platform-verify:
    name: Shared platform verification
    uses: ./.github/workflows/platform-verify.yaml
    permissions:
      contents: read

  publish:
    name: Publish verified image and prepare GitOps candidate
    needs: platform-verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify deployment configuration
        env:
          AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
        run: |
          test -n "$AWS_ROLE_TO_ASSUME" || {
            echo "::error::Repository variable AWS_ROLE_TO_ASSUME is not configured."
            exit 1
          }

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.72.0
          cache: true

      - name: Build or reuse an immutable source image after vulnerability gate
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          image_uri="$ECR_REGISTRY/$ECR_REPOSITORY"
          describe_json="$(mktemp)"
          describe_err="$(mktemp)"
          repository_mutability="$(aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --query 'repositories[0].imageTagMutability' \
            --output text)"
          test "$repository_mutability" = "IMMUTABLE" || {
            echo "::error::ECR repository must enforce immutable tags before CD can trust SHA tag provenance."
            exit 1
          }

          set +e
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --output json >"$describe_json" 2>"$describe_err"
          describe_status="$?"
          set -e

          if [ "$describe_status" -eq 0 ]; then
            image_digest="$(jq -r '.imageDetails[0].imageDigest // empty' "$describe_json")"
            test -n "$image_digest" || {
              echo "::error::Existing ECR tag has no image digest."
              exit 1
            }
            docker pull "$image_uri@$image_digest"
            registry_image_id="$(docker image inspect --format '{{.Id}}' "$image_uri@$image_digest")"
            trivy image --image-src docker --ignorefile .trivyignore --vex .security/vex/live-lab-openssl.openvex.json --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL \
              --scanners vuln "$image_uri@$image_digest"
            publication_mode="reused-existing-tag"
          elif grep -q "ImageNotFoundException" "$describe_err"; then
            docker build --pull --tag "$image_uri:$IMAGE_TAG" ./app
            local_image_id="$(docker image inspect --format '{{.Id}}' "$image_uri:$IMAGE_TAG")"
            trivy image --image-src docker --ignorefile .trivyignore --vex .security/vex/live-lab-openssl.openvex.json --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL \
              --scanners vuln "$image_uri:$IMAGE_TAG"
            docker push "$image_uri:$IMAGE_TAG"
            image_digest="$(aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$IMAGE_TAG" \
              --query 'imageDetails[0].imageDigest' \
              --output text)"
            docker pull "$image_uri@$image_digest"
            registry_image_id="$(docker image inspect --format '{{.Id}}' "$image_uri@$image_digest")"
            test "$local_image_id" = "$registry_image_id" || {
              echo "::error::Registry digest does not match the exact local image that passed vulnerability scanning."
              exit 1
            }
            publication_mode="scanned-before-push"
          else
            echo "::error::Could not determine immutable tag state in ECR."
            cat "$describe_err" >&2
            exit "$describe_status"
          fi

          case "$image_digest" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "::error::ECR returned an invalid digest: $image_digest"; exit 1 ;;
          esac

          printf 'uri=%s\n' "$image_uri" >> "$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$image_digest" >> "$GITHUB_OUTPUT"
          printf 'reference=%s@%s\n' "$image_uri" "$image_digest" >> "$GITHUB_OUTPUT"
          printf 'publication_mode=%s\n' "$publication_mode" >> "$GITHUB_OUTPUT"

      - name: Prepare release evidence directory
        run: mkdir -p release

      - name: Generate an SPDX SBOM for the published digest
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ steps.image.outputs.reference }}
          format: spdx-json
          output-file: release/data-pipeline-app.sbom.spdx.json
          artifact-name: data-pipeline-app-sbom

      - name: Prepare deterministic GitOps release candidate
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python scripts/prepare_release_candidate.py \
            --source-revision "${{ github.sha }}" \
            --image-name "$IMAGE_URI" \
            --image-digest "$IMAGE_DIGEST" \
            --manifest-path k8s/overlays/prod/kustomization.yaml \
            --output-dir release/candidate

      - name: Validate rendered release candidate
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          candidate_root="$(mktemp -d)"
          cp -R k8s "$candidate_root/k8s"
          cp release/candidate/prod-kustomization.yaml "$candidate_root/k8s/overlays/prod/kustomization.yaml"
          kubectl kustomize "$candidate_root/k8s/overlays/prod" > release/rendered-production.yaml
          python scripts/prepare_release_candidate.py \
            --source-revision "${{ github.sha }}" \
            --image-name "$IMAGE_URI" \
            --image-digest "$IMAGE_DIGEST" \
            --manifest-path k8s/overlays/prod/kustomization.yaml \
            --rendered-manifest-path release/rendered-production.yaml \
            --output-dir release/candidate

      - name: Confirm production manifest was not changed
        run: |
          git diff --exit-code -- k8s/overlays/prod/kustomization.yaml

      - name: Prepare deterministic validation release candidate
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python scripts/prepare_release_candidate.py \
            --candidate-target validation \
            --source-revision "${{ github.sha }}" \
            --image-name "$IMAGE_URI" \
            --image-digest "$IMAGE_DIGEST" \
            --manifest-path k8s/overlays/validation/kustomization.yaml \
            --output-dir release/validation-candidate

      - name: Validate rendered validation release candidate
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          candidate_root="$(mktemp -d)"
          cp -R k8s "$candidate_root/k8s"
          cp release/validation-candidate/validation-kustomization.yaml \
            "$candidate_root/k8s/overlays/validation/kustomization.yaml"
          kubectl kustomize "$candidate_root/k8s/overlays/validation" \
            > release/rendered-validation.yaml
          python scripts/prepare_release_candidate.py \
            --candidate-target validation \
            --source-revision "${{ github.sha }}" \
            --image-name "$IMAGE_URI" \
            --image-digest "$IMAGE_DIGEST" \
            --manifest-path k8s/overlays/validation/kustomization.yaml \
            --rendered-manifest-path release/rendered-validation.yaml \
            --output-dir release/validation-candidate

      - name: Confirm validation manifest was not changed
        run: |
          git diff --exit-code -- k8s/overlays/validation/kustomization.yaml

      - name: Generate release evidence
        run: >-
          python scripts/write_release_evidence.py
          --source-revision "${{ github.sha }}"
          --image-name "${{ steps.image.outputs.uri }}"
          --image-digest "${{ steps.image.outputs.digest }}"
          --sbom-path release/data-pipeline-app.sbom.spdx.json
          --manifest-path k8s/overlays/prod/kustomization.yaml
          --candidate-metadata-path release/candidate/release-candidate.json
          --publication-mode "${{ steps.image.outputs.publication_mode }}"
          --output release/release-evidence.json

      - name: Generate validation release evidence
        run: >-
          python scripts/write_release_evidence.py
          --source-revision "${{ github.sha }}"
          --image-name "${{ steps.image.outputs.uri }}"
          --image-digest "${{ steps.image.outputs.digest }}"
          --sbom-path release/data-pipeline-app.sbom.spdx.json
          --manifest-path k8s/overlays/validation/kustomization.yaml
          --candidate-metadata-path release/validation-candidate/release-candidate.json
          --publication-mode "${{ steps.image.outputs.publication_mode }}"
          --output release/validation-release-evidence.json

      - name: Verify candidate evidence consistency before signing
        run: >-
          python scripts/verify_release_bundle.py
          --candidate-dir release/candidate
          --release-evidence release/release-evidence.json
          --sbom release/data-pipeline-app.sbom.spdx.json
          --current-manifest k8s/overlays/prod/kustomization.yaml
          --source-revision "${{ github.sha }}"
          --image-name "${{ steps.image.outputs.uri }}"

      - name: Verify validation candidate evidence consistency before signing
        run: >-
          python scripts/verify_release_bundle.py
          --candidate-target validation
          --candidate-dir release/validation-candidate
          --release-evidence release/validation-release-evidence.json
          --sbom release/data-pipeline-app.sbom.spdx.json
          --current-manifest k8s/overlays/validation/kustomization.yaml
          --source-revision "${{ github.sha }}"
          --image-name "${{ steps.image.outputs.uri }}"

      - name: Attest image SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.uri }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: release/data-pipeline-app.sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest release evidence provenance
        uses: actions/attest@v4
        with:
          subject-path: release/release-evidence.json

      - name: Attest validation release evidence provenance
        uses: actions/attest@v4
        with:
          subject-path: release/validation-release-evidence.json

      - name: Verify production release attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/verify_release_bundle.py
          --candidate-dir release/candidate
          --release-evidence release/release-evidence.json
          --sbom release/data-pipeline-app.sbom.spdx.json
          --current-manifest k8s/overlays/prod/kustomization.yaml
          --source-revision "${{ github.sha }}"
          --image-name "${{ steps.image.outputs.uri }}"
          --verify-attestation
          --verify-image-attestation
          > release/production-verification.json

      - name: Verify validation release attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/verify_release_bundle.py
          --candidate-target validation
          --candidate-dir release/validation-candidate
          --release-evidence release/validation-release-evidence.json
          --sbom release/data-pipeline-app.sbom.spdx.json
          --current-manifest k8s/overlays/validation/kustomization.yaml
          --source-revision "${{ github.sha }}"
          --image-name "${{ steps.image.outputs.uri }}"
          --verify-attestation
          --verify-image-attestation
          > release/validation-verification.json

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 90
