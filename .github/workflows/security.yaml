name: Security

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "app/**"
      - "agentic_ops/**"
      - "k8s/**"
      - "terraform/**"
      - "platform/**"
      - "Jenkinsfile"
      - "scripts/**"
      - ".github/workflows/**"
  push:
    branches: [dev, main]
    paths:
      - "app/**"
      - "agentic_ops/**"
      - "k8s/**"
      - "terraform/**"
      - "platform/**"
      - "Jenkinsfile"
      - "scripts/**"
      - ".github/workflows/**"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      target_url:
        description: "Reachable validation/staging URL for an OWASP ZAP baseline scan"
        required: false
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  python-supply-chain:
    name: Python dependency and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements*.txt
            agentic_ops/requirements.txt
      - name: Install audit tooling
        run: python -m pip install -r app/requirements-dev.txt
      - name: Audit pinned Python dependencies
        run: python -m pip_audit -r app/requirements.txt
      - name: Audit optional Agentic AI dependencies
        run: |
          python -m pip_audit -r agentic_ops/requirements.txt
          python -m pip_audit -r agentic_ops/requirements-bedrock.txt
      - name: Run Python security static analysis
        run: |
          bandit --quiet --severity-level high --exclude app/tests -r app
          bandit --quiet --severity-level high -r agentic_ops
          bandit --quiet --severity-level high scripts/collect_agentic_incident.py scripts/triage_incident.py scripts/platform_doctor.py
          bandit --quiet --severity-level high scripts/verify_release_bundle.py scripts/verify_gitops_deployment.py
          bandit --quiet --severity-level high platform/live-lab/scripts/deploy_gitops_validation.py
          bandit --quiet --severity-level high platform/live-lab/scripts/bind_gitops_alb_identity.py

  infrastructure-and-secret-scan:
    name: IaC and secret policy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.72.0
          cache: true
      - name: Fail on high or critical IaC misconfiguration
        run: trivy config --exit-code 1 --severity HIGH,CRITICAL --misconfig-scanners terraform,kubernetes .
      - name: Fail when a committed secret is detected
        run: trivy fs --exit-code 1 --scanners secret --severity HIGH,CRITICAL .

  container-vulnerability-gate:
    name: Container vulnerability gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build candidate image
        run: docker build --pull --tag data-pipeline-app:security ./app
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.72.0
          cache: true
      - name: Fail on fixable high or critical image vulnerabilities
        run: >-
          trivy image --ignorefile .trivyignore --vex .security/vex/live-lab-openssl.openvex.json
          --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL
          --scanners vuln data-pipeline-app:security
      - name: Verify ignored base SBOM packages are absent at runtime
        run: >-
          docker run --rm data-pipeline-app:security
          -c "import importlib.util; assert importlib.util.find_spec('msgpack') is None; assert importlib.util.find_spec('setuptools') is None"

  dast-baseline:
    name: Optional OWASP ZAP baseline
    if: github.event_name == 'workflow_dispatch' && inputs.target_url != ''
    runs-on: ubuntu-latest
    steps:
      - name: Validate scan target
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          case "$TARGET_URL" in
            http://*|https://*) ;;
            *) echo "target_url must be an http(s) URL" >&2; exit 1 ;;
          esac
      - name: Run ZAP baseline scan
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: >-
          docker run --rm
          --volume "$PWD:/zap/wrk/:rw"
          ghcr.io/zaproxy/zaproxy:stable
          zap-baseline.py
          -t "$TARGET_URL"
          -r zap-baseline.html
      - name: Upload DAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: zap-baseline.html
