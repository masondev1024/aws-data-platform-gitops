name: CodeQL

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/**"
      - ".github/workflows/codeql.yaml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/**"
      - ".github/workflows/codeql.yaml"
  schedule:
    - cron: "43 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@v4
