name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/infra.yaml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/infra.yaml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1

jobs:
  terraform-check:
    name: Terraform validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Initialize providers without a backend
        run: terraform init -backend=false -input=false
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Validate configuration
        run: terraform validate

  terraform-plan:
    name: Terraform plan
    if: ${{ vars.AWS_ROLE_TO_ASSUME != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
      - name: Terraform Plan
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: terraform plan -no-color -input=false

  terraform-plan-not-configured:
    name: Terraform plan configuration notice
    if: ${{ vars.AWS_ROLE_TO_ASSUME == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain skipped cloud plan
        run: |
          echo "::warning::Terraform plan was not run because repository variable AWS_ROLE_TO_ASSUME is not configured."
