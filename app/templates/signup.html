<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>KREAM Style Signup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
    <script src="{{ url_for('static', filename='signup.js') }}" defer></script>
</head>
<body class="bg-gray-50">
    <main class="max-w-md mx-auto py-24 px-4">
        <div class="text-4xl font-black italic tracking-tighter text-center mb-16">
            <a href="{{ url_for('index') }}">ASACDE 1ST RAFFLE</a>
        </div>

        <section class="bg-white rounded-2xl p-10 shadow-sm border border-gray-100">
            <h1 class="text-xl font-bold mb-10">회원가입</h1>
            <div class="space-y-6">
                <div>
                    <label for="uid" class="block text-xs font-bold mb-2">아이디</label>
                    <input type="text" id="uid" autocomplete="username" minlength="3" maxlength="50" placeholder="아이디를 입력하세요"
                           class="w-full py-4 border-b-2 border-gray-100 focus:border-black outline-none text-sm transition-colors">
                </div>
                <div>
                    <label for="pw" class="block text-xs font-bold mb-2">비밀번호</label>
                    <input type="password" id="pw" autocomplete="new-password" minlength="12" maxlength="128" placeholder="12자 이상 비밀번호를 입력하세요"
                           class="w-full py-4 border-b-2 border-gray-100 focus:border-black outline-none text-sm transition-colors">
                </div>
                <div class="pt-6">
                    <button type="button" id="signup-button" class="w-full py-5 bg-black text-white rounded-lg font-bold hover:bg-gray-800 transition-colors">
                        가입 완료
                    </button>
                </div>
            </div>
            <div class="text-center mt-10 text-xs text-gray-400">
                이미 회원이신가요? <a href="{{ url_for('login_page') }}" class="hover:text-black hover:font-bold underline">로그인</a>
            </div>
        </section>
    </main>
</body>
</html>
