apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-pipeline-validation
  namespace: argocd
spec:
  project: kyobo-platform-validation
  source:
    repoURL: https://github.com/masondev1024/aws-data-platform-gitops
    targetRevision: main
    path: k8s/overlays/validation
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-validation
  # HPA owns the live replica count. The session operator owns the verified ALB
  # identity labels; Git must not overwrite either during a sync.
  ignoreDifferences:
    - group: argoproj.io
      kind: Rollout
      name: data-pipeline-rollout
      namespace: platform-validation
      jsonPointers:
        - /spec/replicas
        - /metadata/labels/live-lab.aws~1alb-name
        - /metadata/labels/live-lab.aws~1alb-id
        - /metadata/labels/live-lab.aws~1canary-tg-name
        - /metadata/labels/live-lab.aws~1canary-tg-id
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - RespectIgnoreDifferences=true
